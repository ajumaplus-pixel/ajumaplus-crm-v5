version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: ajumaplus-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ajumaplus_crm
      MYSQL_USER: ajumaplus
      MYSQL_PASSWORD: ajumaplus_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    restart: unless-stopped

  # Backend API
  backend:
    build: ./backend
    container_name: ajumaplus-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ajumaplus_crm
      DB_USER: ajumaplus
      DB_PASSWORD: ajumaplus_password
      JWT_SECRET: your_32_character_secret_here_change_this
      JWT_EXPIRE: 7d
      JWT_REFRESH_EXPIRE: 30d
      FRONTEND_URL: http://localhost:3003
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: your-email@gmail.com
      SMTP_PASSWORD: your-app-password
      SMTP_FROM: your-email@gmail.com
      OPENAI_API_KEY: your-openai-api-key-here
      REDIS_ENABLED: false
      MAX_FILE_SIZE: 10485760
      UPLOAD_DIR: uploads
      WEBHOOK_SECRET: your-webhook-secret-here
    depends_on:
      mysql:
        condition: service_started
    ports:
      - "3001:3001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/uploads

  # Frontend
  frontend:
    build: ./frontend
    container_name: ajumaplus-frontend
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_APP_NAME: AjumaPlus CRM
      VITE_COUNTRY: Ghana
      VITE_CURRENCY: GHS
    ports:
      - "3003:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional - for production)
  # Uncomment this section for production deployment with SSL
  # nginx:
  #   image: nginx:alpine
  #   container_name: ajumaplus-nginx
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   depends_on:
  #     - frontend
  #     - backend
  #   restart: unless-stopped

volumes:
  mysql_data:
