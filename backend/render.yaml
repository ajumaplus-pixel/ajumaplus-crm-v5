services:
  - type: web
    name: ajumaplus-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: JWT_REFRESH_EXPIRE
        value: 30d
      - key: FRONTEND_URL
        value: https://your-frontend-url.vercel.app
      - key: MAX_FILE_SIZE
        value: 10485760
      - key: UPLOAD_DIR
        value: uploads
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: REDIS_ENABLED
        value: false
# Manual environment variables to add in Render dashboard:
# - DATABASE_URL (provided by Render PostgreSQL service)
# - SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, SMTP_FROM (email config)
# - OPENAI_API_KEY (for AI features - optional)
